<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Bills</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        background: #f7f7f5;
        color: #1c1c1a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121212;
          color: #ececea;
        }
      }
      main {
        max-width: 360px;
        line-height: 1.5;
      }
      code {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>App URL not set</h1>
      <p>
        This build of Bills was made without the address of the web app. Rebuild it with
        <code>CAP_SERVER_URL</code> set to the deployed URL (see <code>docs/android.md</code>).
      </p>
    </main>
  </body>
</html>
