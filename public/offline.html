<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Bills Management</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      /* Same colors as src/app/globals.css; this page is static and works without the app's CSS. */
      :root {
        --background: #f7f7f5;
        --foreground: #1c1c1a;
        --surface: #ffffff;
        --muted: #6b6b66;
        --border: #e3e3df;
        --accent: #2f5d8a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #121212;
          --foreground: #ececea;
          --surface: #1b1b1b;
          --muted: #9c9c96;
          --border: #2e2e2c;
          --accent: #7fa8d1;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--background);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Bills Management needs a connection to load your transactions. Check your connection and try
        again.
      </p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
